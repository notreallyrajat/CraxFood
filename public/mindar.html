<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Universal WebAR</title>
    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <!-- MindAR for A-Frame -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      body { margin: 0; overflow: hidden; font-family: sans-serif; }
      #scanning-overlay {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.7); color: white; display: flex;
        flex-direction: column; align-items: center; justify-content: center;
        z-index: 10; text-align: center; padding: 20px; box-sizing: border-box;
      }
      .hidden { display: none !important; }
    </style>
    <script>
      // Component to allow touch rotation
      AFRAME.registerComponent('touch-rotator', {
        init: function () {
          this.isDragging = false;
          this.previousX = 0;
          this.previousY = 0;

          window.addEventListener('touchstart', (e) => {
            this.isDragging = true;
            this.previousX = e.touches[0].screenX;
            this.previousY = e.touches[0].screenY;
          });

          window.addEventListener('touchend', () => {
            this.isDragging = false;
          });

          window.addEventListener('touchmove', (e) => {
            if (!this.isDragging) return;
            const currentX = e.touches[0].screenX;
            const currentY = e.touches[0].screenY;
            const deltaX = currentX - this.previousX;
            const deltaY = currentY - this.previousY;

            this.previousX = currentX;
            this.previousY = currentY;

            const rotation = this.el.getAttribute('rotation');
            
            // Adjust sensitivity (0.5 is standard)
            rotation.y += deltaX * 0.5;
            rotation.x += deltaY * 0.5;

            this.el.setAttribute('rotation', rotation);
          });
        }
      });

      // Dynamic Model Loader
      document.addEventListener("DOMContentLoaded", () => {
        const urlParams = new URLSearchParams(window.location.search);
        const modelUrl = urlParams.get('model') || '/Untitled.glb';
        const assetItem = document.getElementById('dishModel');
        if (assetItem) assetItem.setAttribute('src', modelUrl);
      });
    </script>
  </head>
  <body>
    <div id="scanning-overlay">
      <h2>Universal AR Active</h2>
      <p>Point your camera at a valid Image Target to see the 3D Menu Item.</p>
      <p style="font-size: 0.8em; opacity: 0.8;">(Using default MindAR tracking image)</p>
    </div>

    <!-- 
      We use a default image target provided by MindAR. 
      In a real-world scenario, you would compile your logo or a coaster image into a .mind file.
    -->
    <a-scene 
  mindar-image="imageTargetSrc: /targets.mind;" 

      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <a-asset-item id="dishModel" src="/Untitled.glb"></a-asset-item>
      </a-assets>
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      
      <!-- Target Index 0 corresponds to the first image in the .mind file -->
      <a-entity mindar-image-target="targetIndex: 0">
        
        <!-- Essential lighting for 3D models -->
        <a-light type="ambient" color="#ffffff" intensity="1.2"></a-light>
        <a-light type="directional" color="#ffffff" intensity="1.5" position="-1 2 1"></a-light>

        <!-- A wrapper entity to align the model so its bottom sits flat against the image -->
        <!-- If the bowl is upside down, change rotation to "-90 0 0" -->
        <a-entity rotation="90 0 0">
          <a-gltf-model 
            touch-rotator
            position="0 0 0" 
            scale="0.5 0.5 0.5" 
            src="#dishModel" 
          ></a-gltf-model>
        </a-entity>
      </a-entity>
    </a-scene>

    <script>
      // Hide the scanning overlay once the target is found
      const target = document.querySelector('[mindar-image-target]');
      const overlay = document.querySelector('#scanning-overlay');

      target.addEventListener("targetFound", event => {
        overlay.classList.add('hidden');
      });

      target.addEventListener("targetLost", event => {
        overlay.classList.remove('hidden');
      });
    </script>
  </body>
</html>
