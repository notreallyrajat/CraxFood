<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Universal WebAR</title>
    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <!-- MindAR for A-Frame -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      body { margin: 0; overflow: hidden; font-family: sans-serif; }
      #scanning-overlay {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.7); color: white; display: flex;
        flex-direction: column; align-items: center; justify-content: center;
        z-index: 10; text-align: center; padding: 20px; box-sizing: border-box;
      }
      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <div id="scanning-overlay">
      <h2>Universal AR Active</h2>
      <p>Point your camera at a valid Image Target to see the 3D Menu Item.</p>
      <p style="font-size: 0.8em; opacity: 0.8;">(Using default MindAR tracking image)</p>
    </div>

    <!-- 
      We use a default image target provided by MindAR. 
      In a real-world scenario, you would compile your logo or a coaster image into a .mind file.
    -->
    <a-scene 
      mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.mind;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <a-asset-item id="dishModel" src="/Untitled.glb"></a-asset-item>
      </a-assets>
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      
      <!-- Target Index 0 corresponds to the first image in the .mind file -->
      <a-entity mindar-image-target="targetIndex: 0">
        <!-- We scale the model down slightly and rotate it so it sits flat on the image marker -->
        <a-gltf-model 
          rotation="90 0 0" 
          position="0 0 0" 
          scale="0.5 0.5 0.5" 
          src="#dishModel" 
          animation="property: rotation; to: 90 360 0; dur: 10000; easing: linear; loop: true"
        ></a-gltf-model>
      </a-entity>
    </a-scene>

    <script>
      // Hide the scanning overlay once the target is found
      const target = document.querySelector('[mindar-image-target]');
      const overlay = document.querySelector('#scanning-overlay');

      target.addEventListener("targetFound", event => {
        overlay.classList.add('hidden');
      });

      target.addEventListener("targetLost", event => {
        overlay.classList.remove('hidden');
      });
    </script>
  </body>
</html>
